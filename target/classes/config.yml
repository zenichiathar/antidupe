ender-chest:
  enabled: true
  menu-title-hints:
    - "ender chest"
    - "enderchest"
    - "end chest"
economy:
  ignored-titles:
    - "shop"
    - "orders"
    - "auction"
    - "market"
    - "bazaar"
unstackables:
  enabled: true
  max-stack:
    SPAWNER: 64
    DRAGON_EGG: 1
ec-storage:
  pages: 3
  size: 54
  title: "Ender Chest ({page}/{max})"
  nav-bar: true
scan:
  clamp-on-join: true
  auto-scan: false
  auto-scan-interval-seconds: 60
  clamp: true
timing:
  enabled: true
  drop-pickup:
    roundtrip-ms: 200
    loop-trigger: 4
    window-ms: 2000
  click-spam:
    enabled: true
    per-second: 30
  book-edit:
    enabled: true
    paste-cooldown-ms: 1000
    page-create-cooldown-ms: 2000
  action: flag
  flag-cooldown-ms: 5000
punish:
  mode: none
  ban-days: 1
notify:
  staff: true
logging:
  file: true
  discord-webhook: ""
debug: false