name: Java 21 CI Build and Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Prepare Named Zip and Jar Package
      run: |
        mkdir -p release-folder
        cp target/*.jar release-folder/AntiDupe.jar
        zip -r AntiDupe.zip release-folder/
        cp target/*.jar AntiDupe.jar

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: AntiDupe Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          AntiDupe.jar
          AntiDupe.zip
