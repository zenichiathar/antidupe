name: Java 21 CI Build and Release

on:
  push:
    branches: [ "main" ] # Runs every time you push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Zip the JAR and files
      run: |
        mkdir -p release-folder
        cp target/*.jar release-folder/
        zip -r final-release.zip release-folder/

    - name: Upload Artifacts (Creates the Download Links)
      uses: actions/upload-artifact@v4
      with:
        name: my-java-21-app
        path: |
          target/*.jar
          final-release.zip
